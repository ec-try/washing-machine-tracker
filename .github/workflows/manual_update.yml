name: 手動更新洗衣機售價

on:
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案資料
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝真實瀏覽器與爬蟲引擎
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: 執行實時在線爬蟲 (無預設)
        run: |
          python scraper.py

      - name: 儲存實時最新數據回 GitHub
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add data.json
          git commit -m "Real-time live sync from Fortress & Broadway [skip ci]" || exit 0
          git push
